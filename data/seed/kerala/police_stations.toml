# Kerala police stations (issue #250, spec 0007 section 9).
#
# Converted from V1's MDMS master (case module, PoliceStation; 517 stations).
# Codes are MDMS's 8-digit codes unchanged, so V1 data maps across. Each
# station sits under the revenue district its police district lies in; the
# state-wide railway police and CID stations sit under the state. The MDMS
# district is kept as `police_district`. Names are uppercased, and two
# truncated or misspelt railway station names are corrected.
#
# Load after core/ (which defines `police_district`) and the Kerala state
# and districts:
#   python manage.py seed data/seed/core/
#   python manage.py seed states.toml districts.toml
#   python manage.py seed data/seed/kerala/police_stations.toml
[seed]
model = "locations.Location"

