# The order item catalogue (spec 0039 #3.3), from PRDs/order-template-catalogue.md.
#
# Insert-only: a deployment edits an item, its fields or its suggested purposes in
# admin; re-seeding never overwrites them. An item with `has_workflow` needs a
# handler (`apps/orders/handlers`); a test checks every one has one.
# `stage_event` is dispatched, and `closes_case` cancels the case's open hearings,
# by the last step of the order's triggering (spec 0039 #9.4).

[seed]
model = "orders.OrderItemType"

