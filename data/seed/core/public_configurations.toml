# Public configuration every environment starts with (spec 0034): per-state
# switches, then the e-filing drop-down options. Seeding is insert-only, so a
# state that needs a different value changes the row in the admin after the
# first seed.
#
# Every row here is PUBLIC: it is served to internet clients without
# authentication. Never put secrets, passwords, tokens or credentials here.
[seed]
model = "core.PublicConfiguration"

# E-filing Documents screen: ask, per uploaded document, whether it is
# natively digital (born digital, not a scan), and print the Natively Digital
# column in the complaint PDF's list of documents. On for Kerala; a state that
# does not need it sets it to false. A missing row counts as off.
[[rows]]
config_set = "ui_efiling"
config_key = "natively_digital_document_submission_on"
value_type = "boolean"
config_value = "true"
description = "Show the natively digital question per uploaded document and the Natively Digital column in the complaint PDF. On for Kerala; set false for states that do not need it."

# Drop-down options the e-filing frontend reads from public configuration
# (issue #247).
#
# Each value is a JSON object of {code: label}, in display order. The codes
# are closed sets the backend validates against (spec 0020 §9.4), so they
# MUST match the enum named in each row's description, codes and order alike;
# apps/cases/tests/test_drop_down_seed.py fails when they drift. Change the
# enum and this file together. A code added here alone is rejected by the
# backend on save.
#
# Values are TOML literal strings ('''...''') so the JSON needs no escaping;
# triple quotes also allow the apostrophe in "Drawer's signature".
[[rows]]
config_set = "efiling"
config_key = "entity_type_drop_down"
value_type = "json"
config_value = '''{"PRIVATE_LIMITED_COMPANY": "Private limited company", "PUBLIC_LIMITED_COMPANY": "Public limited company", "LLP": "Limited liability partnership", "PARTNERSHIP_FIRM": "Partnership firm", "PROPRIETORSHIP": "Proprietorship", "SOCIETY_TRUST": "Society / trust", "OTHER_ENTITY": "Other entity"}'''
description = "Institution entity types. Codes mirror apps.parties.models.EntityType; edit labels only."

