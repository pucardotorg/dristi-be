# Process types (spec 0028 #3.1, process-handover.md §2). Who a type may name
# as recipient is backend configuration, not set from the UI.

[seed]
model = "processes.ProcessType"

[[rows]]
code = "NOTICE"
label = "Notice"
order_item_code = "ISSUE_OF_NOTICE"
positive_label = "Delivered"
negative_label = "Not delivered"
allowed_recipient_types = ["ACCUSED", "ACCUSED_PERSON_IN_CHARGE", "WITNESS", "COMPLAINANT"]
stage_key = "notice"

