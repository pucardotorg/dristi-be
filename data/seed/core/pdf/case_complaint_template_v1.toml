# The e-filing complaint PDF (efiling.md section 16), version 1.
#
# Rendered by apps.cases.services.complaint_pdf from the case's own data:
# GET /cases/{id}/complaint-pdf/ previews it, POST stores the copy that is
# signed with every uploaded document appended (DOC-07). Values come from the
# case preview payload and from `extras` the service adds (display labels,
# court name, case title and number, rich text as safe paragraphs).
#
# Laid out as the efiling §16.9 filled sample
# (PRDs/efiling-reference/complaint-pdf-worked-example.pdf): court, case title,
# number and proceeding title head page 1 and the complaint follows on the same
# page; 57pt side margins, 11pt cover lines, 13pt section headings, 7.5pt grey
# labels over 9.5pt values in thirds; no running header or page-number footer.
# A draft prints PREVIEW - NOT FOR FILING at the top.
#
# The `signatures` block draws one slot per signatory, two to a row (DOC-02):
# a rule, the name in bold, the role in grey, and reports where each box lands
# so the signature is placed on it.
#
# A version a job has used is immutable and seeding is insert-only: change
# the template by adding a version 2 row with is_active = true.
[seed]
model = "pdf.PDFTemplateVersion"

[[rows]]
template = "case-complaint"
version = 1
is_active = true

