# SMS templates the applications module notifies with (spec 0033 #16.2).
# The copy is provisional: the master Notifications table owns it.

[seed]
model = "messaging.MessageTemplate"

[[rows]]
message_key = "APPLICATION_PENDING_SIGNATURE"
message_type = "sms"
subject = ""
content = "The {{application_type}} application in case {{case_number}} is ready for your signature. - On Courts"
priority = "MEDIUM"
category = "NOTIFICATION"
max_retries = 0

[rows.data_schema]
type = "object"
required = ["case_number", "application_type", "application_number"]
additionalProperties = false

[rows.data_schema.properties]
case_number = { type = "string" }
application_type = { type = "string" }
application_number = { type = "string" }

