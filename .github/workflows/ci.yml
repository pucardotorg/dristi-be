name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "src/requirements/*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run Django system checks (test settings)
        run: python manage.py check --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Run Django deployment checks (production settings)
        # Dummy production env lives in the committed .env.ci file. The C-DAC
        # eSign check opens the ASP keystore, so generate a throwaway one first.
        run: |
          set -a
          source ../.env.ci
          set +a
          export CDAC_ESIGN_KEYSTORE_PATH="$RUNNER_TEMP/ci-asp-keystore.p12"
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=dristi-ci-dummy-asp" \
            -keyout "$RUNNER_TEMP/ci-asp.key" -out "$RUNNER_TEMP/ci-asp.crt"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/ci-asp.key" -in "$RUNNER_TEMP/ci-asp.crt" \
            -out "$CDAC_ESIGN_KEYSTORE_PATH" -passout env:CDAC_ESIGN_KEYSTORE_PASSWORD
          python manage.py check --deploy

      - name: Run pytest
        run: pytest --cov --cov-report=xml

