name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # post the coverage comment

    defaults:
      run:
        working-directory: ./src

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # diff-cover compares against the base branch, so it needs the history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "src/requirements/*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run Django system checks (test settings)
        run: python manage.py check --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Run Django deployment checks (production settings)
        # Dummy production env lives in the committed .env.ci file. The C-DAC
        # eSign check opens the ASP keystore, so generate a throwaway one first.
        run: |
          set -a
          source ../.env.ci
          set +a
          export CDAC_ESIGN_KEYSTORE_PATH="$RUNNER_TEMP/ci-asp-keystore.p12"
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=dristi-ci-dummy-asp" \
            -keyout "$RUNNER_TEMP/ci-asp.key" -out "$RUNNER_TEMP/ci-asp.crt"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/ci-asp.key" -in "$RUNNER_TEMP/ci-asp.crt" \
            -out "$CDAC_ESIGN_KEYSTORE_PATH" -passout env:CDAC_ESIGN_KEYSTORE_PASSWORD
          python manage.py check --deploy

      - name: Run pytest
        # Coverage only reads config from the current directory, so point it at
        # the root pyproject.toml (omit, fail_under); --cov=. measures src/.
        run: pytest --cov=. --cov-config=../pyproject.toml --cov-report=term --cov-report=xml

      - name: Build coverage comment
        # Built even when tests fail, so the comment shows what was covered.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} \
            --format markdown:diff-coverage.md
          {
            cat diff-coverage.md
            echo
            echo "<details><summary>Whole project: files not fully covered</summary>"
            echo
            # The threshold is enforced by pytest above; here only the table is wanted.
            coverage report --rcfile=../pyproject.toml --fail-under=0 \
              --format=markdown --skip-covered --skip-empty
            echo
            echo "</details>"
          } > coverage-comment.md

      - name: Post coverage comment
        # Fork PRs get a read-only token and cannot comment.
        if: >
          !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          # `uses:` steps ignore the job's working-directory, so the path is from the repo root.
          path: src/coverage-comment.md

      - name: Check coverage of changed lines
        # After the comment is posted, so a failure here still leaves the report on the PR.
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

