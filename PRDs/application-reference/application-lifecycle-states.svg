<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 700" width="1480" height="700" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .s rect { fill:#fff; stroke:#555; stroke-width:1.5; }
      .t rect { fill:#eef2f7; stroke:#1f3a5f; stroke-width:2.5; }
      .s text, .t text { font-size:16px; font-weight:600; fill:#111; text-anchor:middle; }
      .e { stroke:#333; stroke-width:1.5; fill:none; marker-end:url(#a); }
      .d { stroke:#333; stroke-width:1.5; fill:none; marker-end:url(#a); stroke-dasharray:6 4; }
      .l { font-size:13px; fill:#333; }
      .n { font-size:13px; fill:#555; }
      .h { font-size:13px; font-weight:600; fill:#777; letter-spacing:0.5px; }
    </style>
  </defs>
  <rect width="1480" height="700" fill="#fff"/>

  <text class="h" x="30" y="170">FILER SIDE</text>
  <text class="h" x="760" y="170">COURT</text>

  <!-- Expired -->
  <g class="t"><rect x="940" y="40" width="160" height="54" rx="8"/><text x="1020" y="73">Expired</text></g>

  <!-- Top row -->
  <g class="s"><rect x="30" y="200" width="160" height="54" rx="8"/><text x="110" y="233">Draft</text></g>
  <g class="s"><rect x="260" y="200" width="160" height="54" rx="8"/><text x="340" y="233">Pending Signature</text></g>
  <g class="s"><rect x="490" y="200" width="160" height="54" rx="8"/><text x="570" y="233">Pending Payment</text></g>
  <g class="s"><rect x="760" y="200" width="160" height="54" rx="8"/><text x="840" y="233">Pending Review</text></g>
  <g class="s"><rect x="1120" y="200" width="160" height="54" rx="8"/><text x="1200" y="233">Pending Decision</text></g>

  <!-- Decision order -->
  <polygon points="1200,320 1270,365 1200,410 1130,365" fill="#fff8e6" stroke="#8a6d1f" stroke-width="1.5"/>
  <text x="1200" y="361" font-size="13" font-weight="600" text-anchor="middle" fill="#111">Decision</text>
  <text x="1200" y="377" font-size="13" font-weight="600" text-anchor="middle" fill="#111">order</text>

  <!-- Terminals -->
  <g class="t"><rect x="490" y="510" width="160" height="54" rx="8"/><text x="570" y="543">Submitted</text></g>
  <g class="t"><rect x="760" y="510" width="160" height="54" rx="8"/><text x="840" y="543">Dismissed</text></g>
  <g class="t"><rect x="1040" y="510" width="160" height="54" rx="8"/><text x="1120" y="543">Accepted</text></g>
  <g class="t"><rect x="1250" y="510" width="160" height="54" rx="8"/><text x="1330" y="543">Rejected</text></g>

  <!-- Filing -->
  <path class="e" d="M190,216 L258,216"/>
  <text class="l" x="224" y="190" text-anchor="middle">Proceed to sign</text>
  <path class="e" d="M260,240 L192,240"/>
  <text class="l" x="224" y="272" text-anchor="middle">Move back to edit</text>
  <path class="e" d="M420,227 L488,227"/>
  <text class="l" x="454" y="219" text-anchor="middle">Sign</text>
  <path class="e" d="M650,227 L758,227"/>
  <text class="l" x="704" y="219" text-anchor="middle">Pay</text>
  <path class="e" d="M570,254 L570,508"/>
  <text class="l" x="580" y="390">Pay — Objection only</text>

  <!-- Review -->
  <path class="e" d="M920,227 L1118,227"/>
  <text class="l" x="1019" y="219" text-anchor="middle">Onboard</text>
  <path class="e" d="M830,254 L830,508"/>
  <text class="l" x="822" y="440" text-anchor="end">Dismiss</text>
  <path class="e" d="M880,254 L1132,362"/>
  <text class="l" x="955" y="318" transform="rotate(23 955 318)">Onboard and decide today</text>

  <!-- Decision -->
  <path class="e" d="M1200,254 L1200,318"/>
  <text class="l" x="1210" y="292">On the decision date</text>
  <path class="e" d="M1180,398 L1125,508"/>
  <text class="l" x="1130" y="470" text-anchor="end">Accept</text>
  <path class="e" d="M1222,398 L1320,508"/>
  <text class="l" x="1282" y="450">Reject</text>

  <!-- Expiry -->
  <path class="d" d="M860,200 L975,96"/>
  <path class="d" d="M1180,200 L1065,96"/>
  <text class="l" x="1110" y="62">Hearing passes (system) —</text>
  <text class="l" x="1110" y="78">Advance / Prepone and Postpone only</text>

  <!-- Notes -->
  <text class="n" x="30" y="610">Shaded boxes are final: nothing leaves them. A court arrow takes effect once its order is signed and its order data is complete.</text>
  <text class="n" x="30" y="630">Not drawn, because the status does not change: deferring review (stays Pending Review); moving the decision date (stays Pending Decision).</text>
  <text class="n" x="30" y="650">Dismissal happens only before onboarding. In states that need it, the order also records a separate outcome for CIS.</text>
  <text class="n" x="30" y="670">Whether expiry also applies in Draft, Pending Signature and Pending Payment is open (Q-8).</text>
</svg>
