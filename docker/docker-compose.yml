services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dristi
      POSTGRES_USER: dristi
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dristi -d dristi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    # S3-compatible object store used for media uploads.
    # The default image is MinIO; replace with your preferred rustfs image if needed.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        mc alias set rustfs http://rustfs:9000 minioadmin minioadmin &&
        mc mb rustfs/dristi-media --ignore-existing

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["dev"]
    user: root
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://dristi:secret@db:5432/dristi
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      DRAMATIQ_BROKER_URL: redis://redis:6379/2
      S3_API_ENDPOINT: http://rustfs:9000
      S3_BUCKET: dristi-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["worker"]
    user: root
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://dristi:secret@db:5432/dristi
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      DRAMATIQ_BROKER_URL: redis://redis:6379/2
      S3_API_ENDPOINT: http://rustfs:9000
      S3_BUCKET: dristi-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rustfs_data:
