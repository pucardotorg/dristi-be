services:
  db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dristi -d dristi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: docker.io/mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  dramatiq-dashboard:
    image: ghcr.io/thejeshgn/dramatiq-dashboard-docker:latest
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: "${DRAMATIQ_BROKER_URL}"
    depends_on:
      redis:
        condition: service_healthy


  adminer:
    image: adminer
    restart: always
    ports:
      - 9090:8080

  rustfs_perms:
    image: alpine:latest
    user: "0:0"
    volumes:
      - ./rustfs_volumes:/fix_path
    command: chown -R 10001:10001 /fix_path
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    user: "10001:10001"
    ports:
      - "9000:9000" # S3-compatible API
      - "9001:9001" # Web console
    volumes:
      - ./rustfs_volumes/data:/data
      - ./rustfs_volumes/logs:/var/log/rustfs
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY}"
      RUSTFS_OBS_LOGGER_LEVEL: "${RUSTFS_OBS_LOGGER_LEVEL}"
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/local.txt
    command: ["dev"]
    user: root
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/local.txt
    command: ["worker"]
    user: root
    env_file:
      - ../.env
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs: