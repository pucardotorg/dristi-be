services:
  db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: dristi
      POSTGRES_USER: dristi
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dristi -d dristi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: docker.io/mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  dramatiq-dashboard:
    image: ghcr.io/thejeshgn/dramatiq-dashboard-docker:latest
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: "redis://redis:6379/2"
    depends_on:
      redis:
        condition: service_healthy


  adminer:
    image: adminer
    restart: always
    ports:
      - 9090:8080

  rustfs_perms:
    image: alpine:latest
    user: "0:0"
    volumes:
      - ./rustfs_volumes:/fix_path
    command: chown -R 10001:10001 /fix_path
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    user: "10001:10001"
    ports:
      - "9000:9000" # S3-compatible API
      - "9001:9001" # Web console
    volumes:
      - ./rustfs_volumes/data:/data
      - ./rustfs_volumes/logs:/var/log/rustfs
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      # Must stay in sync with S3_ACCESS_KEY / S3_SECRET_KEY on web and worker.
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: this is dummy password
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs

  rustfs-init:
    # Creates the media bucket once rustfs is accepting requests. rustfs does
    # not create buckets on demand, so the first upload fails with
    # NoSuchBucket without this. Uses the AWS CLI because it speaks plain S3;
    # MinIO's `mc` is not an option since the move off MinIO.
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: this is dummy password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - sh
      - -c
      - |
        i=0
        until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ $$i -ge 30 ]; then
            echo "ERROR: rustfs did not become available after 60s."
            exit 1
          fi
          echo "Waiting for rustfs..."
          sleep 2
        done
        aws --endpoint-url http://rustfs:9000 s3 mb s3://dristi-media 2>/dev/null || true
        if aws --endpoint-url http://rustfs:9000 s3 ls s3://dristi-media >/dev/null 2>&1; then
          echo "Bucket dristi-media is ready."
        else
          echo "ERROR: bucket dristi-media could not be created."
          exit 1
        fi

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/local.txt
    command: ["dev"]
    user: root
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://dristi:secret@db:5432/dristi
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      DRAMATIQ_BROKER_URL: redis://redis:6379/2
      S3_API_ENDPOINT: http://rustfs:9000
      S3_BUCKET: dristi-media
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: this is dummy password
      MESSAGING_EMAIL_BACKEND: smtp
      MESSAGING_EMAIL_HOST: mailhog
      MESSAGING_EMAIL_PORT: 1025
      MESSAGING_EMAIL_USE_TLS: "False"
      MESSAGING_EMAIL_USE_SSL: "False"
      MESSAGING_EMAIL_DEFAULT_FROM: dev@example.com
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/local.txt
    command: ["worker"]
    user: root
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://dristi:secret@db:5432/dristi
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      DRAMATIQ_BROKER_URL: redis://redis:6379/2
      S3_API_ENDPOINT: http://rustfs:9000
      S3_BUCKET: dristi-media
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: this is dummy password
      MESSAGING_EMAIL_BACKEND: smtp
      MESSAGING_EMAIL_HOST: mailhog
      MESSAGING_EMAIL_PORT: 1025
      MESSAGING_EMAIL_USE_TLS: "False"
      MESSAGING_EMAIL_USE_SSL: "False"
      MESSAGING_EMAIL_DEFAULT_FROM: dev@example.com
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
