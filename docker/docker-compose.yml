services:
  db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dristi -d dristi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: docker.io/mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  httpbin:
    image: mccutchen/go-httpbin:v2.16.2
    ports:
      - "8888:8080"

  dramatiq-dashboard:
    image: ghcr.io/thejeshgn/dramatiq-dashboard-docker:latest
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: "${DRAMATIQ_BROKER_URL}"
    depends_on:
      redis:
        condition: service_healthy


  adminer:
    image: adminer
    restart: always
    ports:
      - 9090:8080

  rustfs_perms:
    image: alpine:latest
    user: "0:0"
    volumes:
      - ./rustfs_volumes:/fix_path
    command: chown -R 10001:10001 /fix_path
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    user: "10001:10001"
    ports:
      - "9000:9000" # S3-compatible API
      - "9001:9001" # Web console
    volumes:
      - ./rustfs_volumes/data:/data
      - ./rustfs_volumes/logs:/var/log/rustfs
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      # The server's own credentials come from the same S3_* vars the clients
      # read, so the two cannot drift apart.
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY}"
      RUSTFS_OBS_LOGGER_LEVEL: "${RUSTFS_OBS_LOGGER_LEVEL}"
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs

  rustfs-init:
    # Creates the media bucket once rustfs is accepting requests. rustfs does
    # not create buckets on demand, so the first upload fails with
    # NoSuchBucket without this. Uses the AWS CLI because it speaks plain S3;
    # MinIO's `mc` is not an option since the move off MinIO.
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY}"
      AWS_DEFAULT_REGION: us-east-1
      S3_API_ENDPOINT: "${S3_API_ENDPOINT}"
      S3_BUCKET: "${S3_BUCKET}"
    entrypoint:
      - sh
      - -c
      - |
        i=0
        until aws --endpoint-url "$$S3_API_ENDPOINT" s3 ls >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ $$i -ge 30 ]; then
            echo "ERROR: rustfs did not become available after 60s."
            exit 1
          fi
          echo "Waiting for rustfs..."
          sleep 2
        done
        aws --endpoint-url "$$S3_API_ENDPOINT" s3 mb "s3://$$S3_BUCKET" 2>/dev/null || true
        if aws --endpoint-url "$$S3_API_ENDPOINT" s3 ls "s3://$$S3_BUCKET" >/dev/null 2>&1; then
          echo "Bucket $$S3_BUCKET is ready."
        else
          echo "ERROR: bucket $$S3_BUCKET could not be created."
          exit 1
        fi

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/local.txt
    command: ["dev"]
    user: root
    env_file:
      - ../.env
    environment:
      MESSAGING_DUMMY_SMS_ENDPOINT: "http://httpbin/post"
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      httpbin:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/local.txt
    command: ["worker"]
    user: root
    env_file:
      - ../.env
    environment:
      MESSAGING_DUMMY_SMS_ENDPOINT: "http://httpbin/post"
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      httpbin:
        condition: service_started

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs: