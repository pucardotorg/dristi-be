services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dristi
      POSTGRES_USER: dristi
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dristi -d dristi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["dev"]
    user: root
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://dristi:secret@db:5432/dristi
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      DRAMATIQ_BROKER_URL: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["worker"]
    user: root
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://dristi:secret@db:5432/dristi
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      DRAMATIQ_BROKER_URL: redis://redis:6379/2
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
