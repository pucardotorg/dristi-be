x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CACHE_URL: ${CACHE_URL}
  DRAMATIQ_BROKER_URL: ${DRAMATIQ_BROKER_URL}
  S3_API_ENDPOINT: ${S3_API_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  MESSAGING_EMAIL_BACKEND: ${MESSAGING_EMAIL_BACKEND}
  MESSAGING_EMAIL_HOST: ${MESSAGING_EMAIL_HOST}
  MESSAGING_EMAIL_PORT: ${MESSAGING_EMAIL_PORT}
  MESSAGING_EMAIL_USE_TLS: ${MESSAGING_EMAIL_USE_TLS}
  MESSAGING_EMAIL_USE_SSL: ${MESSAGING_EMAIL_USE_SSL}
  MESSAGING_EMAIL_DEFAULT_FROM: ${MESSAGING_EMAIL_DEFAULT_FROM}

services:
  db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISHED_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    ports:
      - "${REDIS_PUBLISHED_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: docker.io/mailhog/mailhog:latest
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_UI_PORT}:8025"

  dramatiq-dashboard:
    image: ghcr.io/thejeshgn/dramatiq-dashboard-docker:latest
    ports:
      - "${DRAMATIQ_DASHBOARD_PORT}:8080"
    environment:
      REDIS_URL: ${DRAMATIQ_REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy


  adminer:
    image: adminer
    restart: always
    ports:
      - "${ADMINER_PUBLISHED_PORT}:8080"

  rustfs_perms:
    image: alpine:latest
    user: "0:0"
    volumes:
      - ./rustfs_volumes:/fix_path
    command: chown -R 10001:10001 /fix_path
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    user: "10001:10001"
    ports:
      - "${S3_PUBLISHED_PORT}:9000" # S3-compatible API
      - "${S3_CONSOLE_PUBLISHED_PORT}:9001" # Web console
    volumes:
      - ./rustfs_volumes/data:/data
      - ./rustfs_volumes/logs:/var/log/rustfs
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_OBS_LOGGER_LEVEL}
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: ${REQUIREMENTS_FILE}
    command: ["dev"]
    user: root
    environment:
      <<: *django-env

    ports:
      - "${WEB_PUBLISHED_PORT}:8000"
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: ${REQUIREMENTS_FILE}
    command: ["worker"]
    user: root
    environment:
      <<: *django-env
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
