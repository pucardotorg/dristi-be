services:
  db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: dristi
      POSTGRES_USER: dristi
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dristi -d dristi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: docker.io/mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  rustfs_perms:
    image: alpine:latest
    user: "0:0"
    volumes:
      - ./rustfs_volumes:/fix_path
    command: chown -R 10001:10001 /fix_path
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    user: "10001:10001"
    ports:
      - "9000:9000" # S3-compatible API
      - "9001:9001" # Web console
    volumes:
      - ./rustfs_volumes/data:/data
      - ./rustfs_volumes/logs:/var/log/rustfs
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: this is dummy password
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["dev"]
    user: root
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://dristi:secret@db:5432/dristi
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      DRAMATIQ_BROKER_URL: redis://redis:6379/2
      S3_API_ENDPOINT: http://rustfs:9000
      S3_BUCKET: dristi-media
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: admin123
      MESSAGING_EMAIL_BACKEND: smtp
      MESSAGING_EMAIL_HOST: mailhog
      MESSAGING_EMAIL_PORT: 1025
      MESSAGING_EMAIL_USE_TLS: "False"
      MESSAGING_EMAIL_USE_SSL: "False"
      MESSAGING_EMAIL_DEFAULT_FROM: dev@example.com
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["worker"]
    user: root
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://dristi:secret@db:5432/dristi
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      DRAMATIQ_BROKER_URL: redis://redis:6379/2
      S3_API_ENDPOINT: http://rustfs:9000
      S3_BUCKET: dristi-media
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      MESSAGING_EMAIL_BACKEND: smtp
      MESSAGING_EMAIL_HOST: mailhog
      MESSAGING_EMAIL_PORT: 1025
      MESSAGING_EMAIL_USE_TLS: "False"
      MESSAGING_EMAIL_USE_SSL: "False"
      MESSAGING_EMAIL_DEFAULT_FROM: dev@example.com
    volumes:
      - ../src:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
